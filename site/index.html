<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hygur is your local digital twin — a private memory of your documents, mail and notes, powered by your own LLM. No cloud, no account. Free app, open-source server, managed cloud, and a marketplace of connectors."
    />
    <meta name="theme-color" content="#faf8f2" />
    <meta property="og:title" content="Hygur — Your local digital twin" />
    <meta
      property="og:description"
      content="A private memory of your documents, mail and notes, powered by your own LLM. Everything runs on your machine."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hygur.ai/" />
    <!-- App screenshot reused as the social preview. A dedicated 1200x630 card
         would frame the brand better. Swap public/og-image.png when one exists. -->
    <meta property="og:image" content="https://hygur.ai/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hygur — Your local digital twin" />
    <meta
      name="twitter:description"
      content="A private memory of your documents, mail and notes, powered by your own LLM. Everything runs on your machine."
    />
    <meta name="twitter:image" content="https://hygur.ai/og-image.png" />
    <title>Hygur — Your local digital twin</title>

    <!-- Structured data: lets Google surface the Hygur Cloud price. availability is
         PreOrder pre-launch; flip to InStock when CLOUD_OPEN goes true. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Hygur",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "macOS, Windows, iOS, Android, Web",
        "url": "https://hygur.ai",
        "description": "A private, local-first memory of your documents, mail and notes, answered by AI with citations. Free local app; a managed EU cloud instance from 29.90 EUR/month.",
        "offers": {
          "@type": "Offer",
          "name": "Hygur Cloud Personal",
          "price": "29.90",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/PreOrder",
          "url": "https://hygur.ai/#/subscribe"
        },
        "publisher": { "@type": "Organization", "name": "0x0800 SRL", "url": "https://hygur.ai" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
