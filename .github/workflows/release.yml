name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    # Apple Silicon runner: the sidecar ships local LLM inference via MLX (and
    # friends), which has no Intel path — so we build an arm64-only bundle.
    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'sidecar/go.mod'
          cache: true
          cache-dependency-path: sidecar/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (Tauri shell)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: webui/src-tauri -> target

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync bundle version to tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          tmp=$(jq --arg v "$VERSION" '.version = $v' webui/src-tauri/tauri.conf.json)
          printf '%s\n' "$tmp" > webui/src-tauri/tauri.conf.json

      - name: Install web UI deps
        run: cd webui && npm ci

      # Builds the WebUI (go:embed), stages the sidecar as the Tauri externalBin,
      # then bundles the .app + DMG. Unsigned/ad-hoc by default — to sign +
      # notarize, set APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD /
      # APPLE_TEAM_ID (Tauri reads them from the environment).
      - name: Build Tauri app + DMG
        run: make tauri-build VERSION=${{ steps.version.outputs.VERSION }}

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls -1 webui/src-tauri/target/release/bundle/dmg/*.dmg | head -n1)
          test -n "$DMG" || { echo "❌ No DMG produced"; exit 1; }
          OUT="Hygur-${{ steps.version.outputs.VERSION }}.dmg"
          cp "$DMG" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "→ $DMG → $OUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          DMG: ${{ steps.dmg.outputs.path }}
        # Idempotent: if the release was created manually before CI got here
        # (or if a previous run already published the asset), upload+clobber
        # rather than failing the whole workflow.
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — uploading DMG with --clobber"
            gh release upload "v${VERSION}" "${DMG}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            echo "Release v${VERSION} does not exist — creating with DMG"
            gh release create "v${VERSION}" "${DMG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Hygur ${VERSION}" \
              --generate-notes
          fi
