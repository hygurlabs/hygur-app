name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'sidecar/go.mod'
          cache: true
          cache-dependency-path: sidecar/go.sum

      - name: Install tools
        run: |
          brew install create-dmg xcodegen
          # xcpretty is optional — fall back gracefully in Makefile if absent
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build sidecar (universal binary)
        run: make -C sidecar build-for-bundle VERSION=${{ steps.version.outputs.VERSION }}

      - name: Build macOS app
        run: |
          cd macos-app && xcodegen generate --quiet
          mkdir -p ../.build/Release
          xcodebuild \
            -scheme Hygur \
            -project Hygur.xcodeproj \
            -configuration Release \
            -derivedDataPath ../.build/DerivedData \
            CONFIGURATION_BUILD_DIR="${PWD}/../.build/Release" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign
        run: codesign --deep --force --sign "-" .build/Release/Hygur.app

      - name: Package DMG
        run: |
          create-dmg \
            --volname "Hygur ${{ steps.version.outputs.VERSION }}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Hygur.app" 175 190 \
            --hide-extension "Hygur.app" \
            --app-drop-link 425 190 \
            ".build/Hygur-${{ steps.version.outputs.VERSION }}.dmg" \
            ".build/Release/Hygur.app"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        # Idempotent: if the release was created manually before CI got here
        # (or if a previous run already published the asset), upload+clobber
        # rather than failing the whole workflow. v0.2.0 hit this — the manual
        # `gh release create` happened before CI uploaded the DMG.
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — uploading DMG with --clobber"
            gh release upload "v${VERSION}" \
              ".build/Hygur-${VERSION}.dmg" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            echo "Release v${VERSION} does not exist — creating with DMG"
            gh release create "v${VERSION}" \
              ".build/Hygur-${VERSION}.dmg" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Hygur ${VERSION}" \
              --generate-notes
          fi
